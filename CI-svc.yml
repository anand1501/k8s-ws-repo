apiVersion: v1
kind: Service
metadata:
  name: cisvc
spec:
  type: ClusterIP # "ClusterIP"` means a service will only be accessible inside the cluster, via the cluster IP.
  selector:
    dc: IN
    app: web
    env: dev
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 80
    