apiVersion: apps/v1
kind: Deployment
metadata:
  name: rudeploy
  labels:
    app: web
    dc: IN
    env: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
      dc: IN
      env: dev
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: web
        dc: IN
        env: dev
    spec:
      containers:
      - name: ruc
        image: "vimal13/apache-webserver-php:v10"
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: rusvc
spec:
  type: NodePort
  selector:
    app: web
    dc: IN
    env: dev
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 80
    nodePort: 30000


